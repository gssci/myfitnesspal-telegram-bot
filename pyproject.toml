[project]
name = "nutrition-summary-pdf"
version = "0.1.0"
description = "Create a one-page A4 weekly nutrition report from MyFitnessPal CSV exports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116",
    "langchain>=1.0",
    "langchain-mcp-adapters>=0.2",
    "langchain-ollama>=1.0",
    "matplotlib>=3.9",
    "mcp>=1.25,<2",
    "python-dotenv>=1.1",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
mfp-agent = "mfp_agent.cli:main"
mfp-chat = "mfp_agent.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mfp_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
