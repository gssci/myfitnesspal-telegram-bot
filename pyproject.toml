[project]
name = "myfitnesspal-telegram-bot"
version = "0.1.0"
description = "LangChain chat agent with a Telegram interface for the MyFitnessPal MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116",
    "langchain>=1.0",
    "langchain-mcp-adapters>=0.2",
    "langchain-ollama>=0.3",
    "langchain-openai>=1.4.1",
    "mcp>=1.25,<2",
    "python-dotenv>=1.1",
    "python-telegram-bot>=22.5,<23",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
mfp-agent = "mfp_agent.cli:main"
mfp-chat = "mfp_agent.web:main"
mfp-telegram = "mfp_agent.telegram:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mfp_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
